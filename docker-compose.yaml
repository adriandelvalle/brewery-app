services:
  brewery-db:
    container_name: brewery-db
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - brewery-db-data:/var/lib/postgresql/data
    networks:
      - brewery-network
    restart: unless-stopped

  brewery-api:
    container_name: brewery-api
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - brewery-network
    ports:
      - "8000:8000"
    depends_on:
      - brewery-db
    restart: unless-stopped

  brewery-nginx:
    container_name: brewery-nginx
    build: ./nginx
    networks:
      - brewery-network
    ports:
      - "80:80"
    volumes:
      - ./static:/usr/share/nginx/html/static:ro
    depends_on:
      - brewery-api
    restart: unless-stopped

  brewery-cloudflared:
    container_name: brewery-cloudflared
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://brewery-nginx:80
    networks:
      - brewery-network
    restart: unless-stopped
    depends_on:
      - brewery-nginx

volumes:
  brewery-db-data:

networks:
  brewery-network:
    driver: bridge
